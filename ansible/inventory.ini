# Inventory = the list of machines Ansible manages, grouped by role.
# Option A: a remote Ubuntu 22.04/24.04 VM (VirtualBox, AWS EC2, etc.)
[app_servers]
ctd-server-1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

# Option B: configure the machine you are sitting on (Ubuntu / WSL2 Ubuntu).
# Comment out Option A above and uncomment this line:
# localhost ansible_connection=local

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
